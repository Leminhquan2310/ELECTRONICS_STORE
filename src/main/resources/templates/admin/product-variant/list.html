<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Admin - Product Variant Manage</title>
    <th:block th:replace="~{layout/layout-admin :: css}"></th:block>
</head>
<body>
<div th:replace="~{layout/layout-admin :: preloader}"></div>
<div id="main-wrapper">
    <div class="nav-header" th:replace="~{layout/layout-admin :: nav-header}"></div>

    <div class="header" th:replace="~{layout/layout-admin :: header}"></div>

    <div th:replace="~{layout/layout-admin :: nk-sidebar}"></div>

    <div class="content-body">
        <div class="row page-titles mx-0">
            <div class="col-sm-6 p-md-0">
                <div class="breadcrumb-range-picker">
                    <span><i class="icon-folder-alt"></i></span>
                    <span class="ml-1">Product Variant Management</span>
                </div>
            </div>
            <div class="col-sm-6 p-md-0 justify-content-sm-end mt-2 mt-sm-0 d-flex">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/admin/product-variants}">Product Variant</a></li>
                </ol>
            </div>
        </div>

        <!--        <div style="-->
        <!--                    margin-left: 30px;-->
        <!--                    gap: 15px;-->
        <!--                    display: grid;-->
        <!--                    grid-auto-flow: column;-->
        <!--                    grid-auto-columns: max-content;-->
        <!--                ">-->
        <!--        </div>-->

        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table id="example" class="display" style="min-width: 845px">
                                    <thead>
                                    <tr>
                                        <th>Name Product</th>
                                        <th>SKU</th>
                                        <th>Variant</th>
                                        <th>Price Adjusting</th>
                                        <th>Stock Quantity</th>
                                        <th>Action</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="v : ${productVariantAdminDto}">
                                        <td th:text="${v.product.name}"></td>
                                        <td th:text="${v.sku}"></td>
                                        <td th:text="${v.optionText}"></td>
                                        <td th:text="${#numbers.formatDecimal(v.priceAdjustment, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td th:text="${v.stockQuantity}"></td>
                                        <td>
                                            <span>
                                                <a href="javascript:void(0)"
                                                   data-toggle="modal"
                                                   data-target="#variantModal"
                                                   th:attr="
                                                                    data-variant-id=${v.id},
                                                                    data-price-adjustment=${v.priceAdjustment},
                                                                    data-stock-quantity=${v.stockQuantity}
                                                                "
                                                   class="mr-4" data-placement="top" title="Edit">
                                                    <i class="icon-pencil"></i></a>
                                            </span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="variantModal">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <form th:action="@{/admin/product-variants/update}" th:method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Product Variant</h5>
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="variantId" name="id">

                        <div class="mb-3">
                            <label>Price Adjustment</label>
                            <input type="number" id="priceAdjustment"
                                   name="priceAdjustment"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Stock Quantity</label>
                            <input type="number" id="stockQuantity"
                                   name="stockQuantity"
                                   class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/layout-admin :: script}"></th:block>
<script>
    $('#variantModal').on('show.bs.modal', function (e) {
        const b = e.relatedTarget
        $(this).find('input[name="id"]').val(b.dataset.variantId)
        $(this).find('#priceAdjustment')
            .val(Number(b.dataset.priceAdjustment))
        $(this).find('#stockQuantity')
            .val(Number(b.dataset.stockQuantity))
    })
</script>
</body>
</html>
