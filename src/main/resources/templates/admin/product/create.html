<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <link rel="stylesheet" th:href="@{/admin/plugins/bootstrap-select/dist/css/bootstrap-select.min.css}">
    <th:block th:replace="~{layout/layout-admin :: css}"></th:block>
    <style>
        .text-label {
            font-weight: 600;
            margin-bottom: 6px;
            display: inline-block;
        }

        /* ===== FILE INPUT ===== */
        .custom-file {
            position: relative;
        }

        .custom-file-input {
            cursor: pointer;
        }

        .custom-file-label {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ===== OPTION AREA ===== */
        #option-container {
            width: 100%;
            margin-top: 1rem;
        }

        .option-item {
            border: 1px solid #e3e6f0;
            border-radius: 6px;
            background: #fafbfe;
        }

        .option-item .card-body {
            padding: 1rem;
        }

        /* Option name */
        .option-item input[type="text"]:first-child {
            font-weight: 600;
        }

        /* ===== VALUE INPUT ===== */
        .value-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        /* ===== OPTION BUTTONS ===== */
        .option-item .btn-secondary {
            margin-top: 5px;
        }

        .option-item .btn-danger {
            margin-top: 5px;
        }

        /* ===== ADD OPTION BUTTON ===== */
        .btn-add-option-wrapper {
            width: 100%;
            margin: 10px 0 20px;
        }

        .btn-add-option-wrapper button {
            min-width: 140px;
        }

    </style>
</head>
<body>
<div th:replace="~{layout/layout-admin :: preloader}"></div>
<div id="main-wrapper">
    <div class="nav-header" th:replace="~{layout/layout-admin :: nav-header}"></div>

    <div class="header" th:replace="~{layout/layout-admin :: header}"></div>

    <div th:replace="~{layout/layout-admin :: nk-sidebar}"></div>

    <div class="content-body">
        <div class="row page-titles mx-0">
            <div class="col-sm-6 p-md-0">
                <div class="breadcrumb-range-picker">
                    <span><i class="icon-folder-alt"></i></span>
                    <span class="ml-1">Product Management</span>
                </div>
            </div>
            <div class="col-sm-6 p-md-0 justify-content-sm-end mt-2 mt-sm-0 d-flex">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/admin/products}">Product</a></li>
                    <li class="breadcrumb-item active"><a href="javascript:void(0)">Create</a></li>
                </ol>
            </div>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/products}"
                                  th:object="${productDtoCreate}"
                                  method="post"
                                  enctype="multipart/form-data">
                                <div>
                                    <section>
                                        <div class="row">
                                            <!-- Tên sản phẩm -->
                                            <div class="col-lg-6 mb-4">
                                                <div class="col-lg-12 mb-4">
                                                    <div class="form-group">
                                                        <label class="text-label">Name*</label>
                                                        <input type="text" th:field="*{name}"
                                                               class="form-control border-primary"
                                                               placeholder="Name of product" required>
                                                        <div class="text-danger mt-1"
                                                             th:if="${#fields.hasErrors('name')}"
                                                             th:errors="*{name}"></div>
                                                    </div>
                                                </div>

                                                <!-- Description -->
                                                <div class="col-lg-12 mb-4">
                                                    <div class="form-group">
                                                        <label class="text-label">Description*</label>
                                                        <textarea th:field="*{description}" rows="4" cols="50"
                                                                  class="form-control border-primary"
                                                                  placeholder="Description of product"
                                                                  required></textarea>
                                                        <div class="text-danger mt-1"
                                                             th:if="${#fields.hasErrors('description')}"
                                                             th:errors="*{description}"></div>
                                                    </div>
                                                </div>

                                                <!-- Base price -->
                                                <div class="col-lg-12 mb-4">
                                                    <div class="form-group">
                                                        <label class="text-label">Base Price*</label>
                                                        <input type="number" th:field="*{basePrice}"
                                                               class="form-control border-primary"
                                                               placeholder="Base price" required>
                                                        <div class="text-danger mt-1"
                                                             th:if="${#fields.hasErrors('basePrice')}"
                                                             th:errors="*{basePrice}"></div>
                                                    </div>
                                                </div>
                                            </div>


                                            <div class="col-lg-6 mb-4">
                                                <div class="col-lg-12 mb-4">
                                                    <!-- Upload ảnh -->
                                                    <div class="col-lg-6 mb-4">
                                                        <div class="form-group">
                                                            <label class="text-label">Images*</label>
                                                            <div class="custom-file">
                                                                <input type="file" class="custom-file-input"
                                                                       th:field="*{images}" multiple>
                                                                <label class="custom-file-label">Choose file</label>
                                                            </div>
                                                        </div>
                                                    </div>


                                                    <div class="col-lg-12 mb-4">
                                                        <div class="form-group">
                                                            <label class="text-label">Category*</label>
                                                            <select class="selectpicker form-control"
                                                                    th:field="*{categoryId}"
                                                                    data-style="btn-outline-primary"
                                                                    data-live-search="true">
                                                                <th:block th:each="cat : ${categories}">
                                                                    <option th:value="${cat.id}"
                                                                            th:text="${cat.name}"></option>
                                                                </th:block>
                                                            </select>
                                                        </div>
                                                    </div>

                                                    <div class="col-lg-12 mb-4">
                                                        <label class="text-label font-weight-bold">Product
                                                            Options</label>
                                                        <div id="option-container">
                                                        </div>

                                                        <button type="button" class="btn btn-sm btn-info mt-2"
                                                                id="btnAddOption">
                                                            <i class="fa fa-plus"></i> Add Another Option
                                                        </button>
                                                    </div>

                                                    <script th:inline="javascript">
                                                        /*<![CDATA[*/
                                                        const ALL_OPTIONS = /*[[${allOptions}]]*/ [];
                                                        /*]]>*/
                                                    </script>
                                                </div>
                                            </div>


                                            <div class="col-lg-12 mb-4">
                                                <button type="submit" class="btn btn-rounded btn-ft btn-primary">
                                                    + Add
                                                </button>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/layout-admin :: script}"></th:block>
<script th:src="@{/admin/plugins/bootstrap-select/dist/js/bootstrap-select.min.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.custom-file-input')
            .forEach(function (input) {
                input.addEventListener('change', function () {
                    const files = this.files;
                    const label = this.nextElementSibling;

                    if (!label) return;

                    if (files.length === 1) {
                        label.textContent = files[0].name;
                    } else if (files.length > 1) {
                        label.textContent = files.length + ' files selected';
                    } else {
                        label.textContent = 'Choose file';
                    }
                });
            });
    });

    $(document).ready(function () {
        // Biến đếm để tạo index name="options[0]...", name="options[1]..."
        // Giúp Spring Boot binding dữ liệu List dễ dàng
        let optionIndex = 0;

        // Hàm tạo dòng HTML mới
        function createOptionRow(index) {
            let optionsHtml = '<option value="">Select Option Type</option>';

            // Tạo danh sách Option cha
            ALL_OPTIONS.forEach(opt => {
                optionsHtml += `<option value="${opt.id}">${opt.name}</option>`;
            });

            return `
            <div class="card mb-3 option-row" id="row-${index}">
                <div class="card-body p-3">
                    <div class="row align-items-center">
                        <div class="col-md-4">
                            <label>Option Name</label>
                            <select class="form-control selectpicker option-type-select"
                                    data-live-search="true"
                                    data-style="btn-outline-secondary"
                                    name="options[${index}].optionId"
                                    data-index="${index}">
                                ${optionsHtml}
                            </select>
                        </div>

                        <div class="col-md-7">
                            <label>Option Values</label>
                            <select class="form-control selectpicker option-value-select"
                                    multiple
                                    data-live-search="true"
                                    data-selected-text-format="count > 3"
                                    data-style="btn-outline-primary"
                                    title="Choose values..."
                                    name="options[${index}].valueIds"
                                    id="val-select-${index}" disabled>
                                    </select>
                        </div>

                        <div class="col-md-1 text-right mt-4">
                            <button type="button" class="btn btn-danger btn-sm btn-remove-row" data-id="${index}">
                                &times;
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // Sự kiện click nút Add Option
        $('#btnAddOption').click(function () {
            const html = createOptionRow(optionIndex);
            $('#option-container').append(html);

            // Refresh lại selectpicker cho các element mới sinh ra
            $('.selectpicker').selectpicker('render');

            optionIndex++;
        });

        // Sự kiện khi thay đổi Option Type (dùng delegate event vì element sinh ra động)
        $(document).on('change', '.option-type-select', function () {
            const selectedOptionId = $(this).val();
            const currentIndex = $(this).data('index');
            const valueSelect = $(`#val-select-${currentIndex}`);

            // Tìm data của option đã chọn trong mảng global
            const optionData = ALL_OPTIONS.find(opt => opt.id == selectedOptionId);

            // Reset và enable select values
            valueSelect.empty().prop('disabled', false);

            if (optionData && optionData.values) {
                let valuesHtml = '';
                optionData.values.forEach(val => {
                    valuesHtml += `<option value="${val.id}">${val.value}</option>`;
                });
                valueSelect.append(valuesHtml);
            } else {
                valueSelect.prop('disabled', true);
            }

            // Cực kỳ quan trọng: Refresh lại UI của bootstrap-select
            valueSelect.selectpicker('refresh');
        });

        // Sự kiện xóa dòng
        $(document).on('click', '.btn-remove-row', function () {
            const id = $(this).data('id');
            $(`#row-${id}`).remove();
        });
    });
</script>
</body>
</html>
